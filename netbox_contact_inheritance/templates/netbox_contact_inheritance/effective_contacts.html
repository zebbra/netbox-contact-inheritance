{% load i18n %}
<div class="card">
  <h2 class="card-header">{{ title }}</h2>
  {% if effective_contacts %}
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>{% trans "Contact" %}</th>
            <th>{% trans "Role" %}</th>
            <th>{% trans "From" %}</th>
          </tr>
        </thead>
        <tbody>
          {% include 'netbox_contact_inheritance/_contact_rows.html' with items=effective_contacts %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="card-body text-muted">{% trans "None" %}</div>
  {% endif %}
</div>
